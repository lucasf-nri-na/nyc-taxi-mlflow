[project]
name = "nyc_taxi_mlflow"
version = "0.0.1"
authors = [{ name = "nyc-taxi-mlflow contributors" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
ci = [
    "pytest",
    "ruff",
    "pyyaml",
]
dev = [
    { include-group = "ci" },
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

[project.scripts]
main = "nyc_taxi_mlflow.main:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/*.ipynb" = ["F821"]
"src/nyc_taxi_mlflow_etl/transformations/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: requires authenticated Databricks serverless compute"]
