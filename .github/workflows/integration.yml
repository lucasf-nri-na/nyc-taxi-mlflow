name: Manual integration tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main-only:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main integration runs
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Integration tests must use main"
            exit 1
          }
  integration:
    needs: main-only
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_service_principal_id: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_SERVERLESS_COMPUTE_ID: auto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.1
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - uses: ./.github/actions/databricks-auth
      - run: uv run --frozen pytest tests/integration -m integration
