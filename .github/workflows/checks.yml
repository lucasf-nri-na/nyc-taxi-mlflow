name: Offline checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.1
          python-version: "3.12"
      - run: uv sync --frozen --only-group ci
      - run: uv run --frozen --only-group ci ruff check .
      - run: uv run --frozen --only-group ci pytest
      - run: uv build --wheel
      - name: Verify wheel content
        run: |
          uv run --frozen --only-group ci python -c 'from pathlib import Path; from zipfile import ZipFile; wheels = list(Path("dist").glob("*.whl")); assert len(wheels) == 1; files = ZipFile(wheels[0]).namelist(); assert "nyc_taxi_mlflow/main.py" in files; assert "nyc_taxi_mlflow/taxis.py" in files'
