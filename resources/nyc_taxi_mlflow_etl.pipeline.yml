# The main pipeline for nyc_taxi_mlflow

resources:
  pipelines:
    nyc_taxi_mlflow_etl:
      name: nyc_taxi_mlflow_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/nyc_taxi_mlflow_etl"

      libraries:
        - glob:
            include: ../src/nyc_taxi_mlflow_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
